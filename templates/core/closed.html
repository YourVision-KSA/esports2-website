{% extends "base.html" %}
{% block content %}
<div class="wrap closed-box">
  {% if message_key == "REG_CLOSED" %}<h2>{{ content.REG_CLOSED }}</h2>
  {% elif message_key == "VOTE_CLOSED" %}<h2>{{ content.VOTE_CLOSED }}</h2>
  {% else %}<h2>{{ content.PHASE_SOON }}</h2>{% endif %}
  <p style="padding-block-start: 14px;"><a href="/">{{ content.SITE_NAME }} ←</a></p>
</div>
{% endblock %}
