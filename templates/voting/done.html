{% extends "base.html" %}
{% block funnel_tag %}VOTE{% endblock %}
{% block content %}
<div class="funnel">
  <div class="success-panel">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3EC7D6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m8 12 3 3 5-6"></path></svg>
      <h1 style="font-size: 22px;">
        {% if message_key == "VOTE_DUP" %}{{ content.VOTE_DUP }}{% else %}{{ content.VOTE_DONE }}{% endif %}
      </h1>
    </div>
  </div>
  <p><a href="/">{{ content.SITE_NAME }} ←</a></p>
</div>
{% endblock %}
