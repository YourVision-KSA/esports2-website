[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Arabic strings are copied verbatim from docs/content-ar.md and must not be
# re-wrapped or split (CLAUDE.md hard rule 1).
"core/content.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "esports.settings.local"
python_files = ["test_*.py"]
markers = [
    "concurrency: multi-threaded tests that need real PostgreSQL (docs/testing.md)",
]
filterwarnings = ["ignore::DeprecationWarning"]
